<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Python A4 手抄版｜圖像檢視器</title><style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#eee}
.header{position:sticky;top:0;z-index:10;background:rgba(17,17,17,.92);backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:16px;margin:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button{padding:8px 12px;border:1px solid #444;background:#1f1f1f;color:#eee;border-radius:10px;cursor:pointer}.toolbar button:hover{background:#2b2b2b}
.wrap{padding:20px;display:flex;flex-direction:column;gap:22px;align-items:center}.pagewrap{background:#1b1b1b;padding:14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
img.page{display:block;max-width:min(96vw,900px);width:var(--zoom,100%);height:auto;border-radius:10px;background:#fff}
.note{font-size:13px;color:#bbb}
a{color:#9ad0ff}
</style></head><body>
<div class="header"><h1>Python A4 手抄版｜圖像檢視器</h1><div class="toolbar"><button onclick="setZoom(0.8)">80%</button><button onclick="setZoom(1)">100%</button><button onclick="setZoom(1.25)">125%</button><button onclick="setZoom(1.5)">150%</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">回頂部</button></div></div>
<div class="wrap"><div class="note">把這個 HTML 與兩張圖片放在同一個 GitHub Pages 資料夾即可。</div><div class="pagewrap"><img class="page" id="p1" src="Python_A4_Handcopy_Page1.png" alt="Python A4 手抄版第 1 頁"></div><div class="pagewrap"><img class="page" id="p2" src="Python_A4_Handcopy_Page2.png" alt="Python A4 手抄版第 2 頁"></div></div>
<script>function setZoom(v){document.documentElement.style.setProperty('--zoom',(v*100)+'%')}</script></body></html>
